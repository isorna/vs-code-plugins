<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#d4a020"/>
    </linearGradient>
    <linearGradient id="meter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="60%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="20" ry="20" fill="url(#bg)"/>

  <!-- Token coin -->
  <circle cx="64" cy="56" r="32" fill="url(#coin)" opacity="0.9"/>
  <circle cx="64" cy="56" r="26" fill="none" stroke="#b8860b" stroke-width="2" opacity="0.6"/>

  <!-- "T" letter on coin -->
  <text x="64" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="32" fill="#1a1a2e">T</text>

  <!-- Gauge arc (bottom half) -->
  <path d="M 28 100 A 36 36 0 0 1 100 100" fill="none" stroke="#2a2a4a" stroke-width="8" stroke-linecap="round"/>
  <path d="M 28 100 A 36 36 0 0 1 88 78" fill="none" stroke="url(#meter)" stroke-width="8" stroke-linecap="round"/>

  <!-- Gauge needle -->
  <line x1="64" y1="100" x2="80" y2="84" stroke="#f8f8f8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="100" r="4" fill="#f8f8f8"/>

  <!-- Small dollar sign -->
  <text x="104" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="18" fill="#4cc9f0" opacity="0.8">$</text>
</svg>
